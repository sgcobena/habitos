<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi día cuqui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Idea: columna de móvil con mascota que reacciona al progreso, tira semanal con anillos y tarjetas pastel, una por hábito */
:root{
  --bg:#FFF5F8; --surface:#FFFFFF; --ink:#4B3A52; --ink-soft:#826F8A; --line:#F6E1EA; --on:#FFFFFF; --mascot:#FFB3C7;
  --pink:#FFE0E9; --pink-d:#D9487A;
  --lilac:#EBE1FB; --lilac-d:#7C5CC4;
  --mint:#D7F3E6; --mint-d:#2E8F6B;
  --peach:#FFE3D0; --peach-d:#D96B2B;
  --butter:#FFF3BF; --butter-d:#A97C06;
  --sky:#D9ECFB; --sky-d:#2F7FB8;
  --display:'Fredoka','Nunito',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#241B2B; --surface:#33263C; --ink:#F7EAF3; --ink-soft:#BCA8C6; --line:#493550; --on:#2A1D32; --mascot:#FF9DB8;
    --pink:#4D2D41; --pink-d:#FF8FB4; --lilac:#3F3260; --lilac-d:#B9A0F5; --mint:#254A41; --mint-d:#6FD4A9;
    --peach:#52352B; --peach-d:#FFA773; --butter:#4B4222; --butter-d:#F2CB5B; --sky:#263E57; --sky-d:#7CC1F0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#241B2B; --surface:#33263C; --ink:#F7EAF3; --ink-soft:#BCA8C6; --line:#493550; --on:#2A1D32; --mascot:#FF9DB8;
  --pink:#4D2D41; --pink-d:#FF8FB4; --lilac:#3F3260; --lilac-d:#B9A0F5; --mint:#254A41; --mint-d:#6FD4A9;
  --peach:#52352B; --peach-d:#FFA773; --butter:#4B4222; --butter-d:#F2CB5B; --sky:#263E57; --sky-d:#7CC1F0;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.wrap{max-width:480px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom))}
:focus-visible{outline:3px solid var(--lilac-d);outline-offset:2px}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{font-size:13px;font-weight:800;color:var(--ink-soft);letter-spacing:.02em}
h1{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;text-wrap:balance}
.msg{margin-top:6px;font-weight:600;color:var(--ink-soft);text-wrap:balance}
.mascot{position:relative;width:104px;height:104px;flex:none}
.mascot svg{width:100%;height:100%;display:block}
.mascot.m4 svg{animation:bob 1.8s ease-in-out infinite}
.badge{position:absolute;right:-2px;bottom:2px;background:var(--pink-d);color:var(--on);font-family:var(--display);font-weight:600;font-size:14px;border-radius:99px;padding:2px 10px;border:3px solid var(--bg)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}

/* tira semanal */
.week{display:flex;align-items:center;gap:4px;margin:18px -4px 18px}
.arrow{width:30px;height:40px;border:0;background:transparent;color:var(--ink-soft);display:grid;place-items:center;border-radius:12px;flex:none}
.arrow:disabled{opacity:.3;cursor:default}
.days{flex:1;display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.wd{border:0;background:transparent;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:16px;font-weight:800;font-size:12px;color:var(--ink-soft)}
.wd:disabled{opacity:.4;cursor:default}
.ring{width:38px;height:38px;border-radius:50%;background:conic-gradient(var(--pink-d) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center}
.ring span{width:30px;height:30px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:13px;font-weight:800;color:var(--ink)}
.wd[aria-current="date"]{color:var(--ink)}
.wd[aria-current="date"] .ring span{background:var(--pink-d);color:var(--on)}
.wd.today .ring span{box-shadow:0 0 0 2px var(--surface) inset}
.note{background:var(--butter);color:var(--ink);border-radius:16px;padding:10px 14px;font-size:14px;font-weight:600;margin-bottom:14px}

/* tarjetas */
.stack{display:flex;flex-direction:column;gap:14px}
.card{--a:var(--pink);--ad:var(--pink-d);background:var(--surface);border:2px solid var(--a);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 22px -16px var(--ad)}
.c-sport{--a:var(--pink);--ad:var(--pink-d)}
.c-sleep{--a:var(--lilac);--ad:var(--lilac-d)}
.c-steps{--a:var(--mint);--ad:var(--mint-d)}
.c-fv{--a:var(--peach);--ad:var(--peach-d)}
.c-protein{--a:var(--butter);--ad:var(--butter-d)}
.c-skin{--a:var(--sky);--ad:var(--sky-d)}
.ch{display:flex;align-items:center;gap:12px}
.ib{width:46px;height:46px;border-radius:16px;background:var(--a);color:var(--ad);display:grid;place-items:center;flex:none}
.ch .t{flex:1;min-width:0}
h2{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.15}
.sub{font-size:14px;font-weight:600;color:var(--ink-soft)}
.tog{width:46px;height:46px;border-radius:50%;border:2px solid var(--a);background:var(--surface);color:transparent;display:grid;place-items:center;flex:none;transition:background .15s,transform .15s}
.tog[aria-pressed="true"],.tog.on{background:var(--ad);border-color:var(--ad);color:var(--on);animation:pop .3s}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--a);background:var(--surface);border-radius:99px;padding:6px 14px;min-height:40px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--ad);border-color:var(--ad);color:var(--on)}
.bar{height:10px;border-radius:99px;background:var(--a);overflow:hidden}
.bar i{display:block;height:100%;width:calc(var(--w)*1%);background:var(--ad);border-radius:99px;transition:width .3s}
.big{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.big input{width:7.5ch;border:0;border-bottom:3px solid var(--a);background:transparent;font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;padding:0 0 2px;border-radius:0;outline-offset:4px}
.big .of{font-weight:700;color:var(--ink-soft)}
.stepper{display:flex;align-items:center;gap:12px}
.stepper .val{font-family:var(--display);font-weight:600;font-size:34px;min-width:5.2ch;text-align:center}
.round{width:44px;height:44px;border-radius:50%;border:2px solid var(--a);background:var(--surface);color:var(--ad);display:grid;place-items:center}

/* skincare */
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:2px solid var(--a);border-radius:18px;padding:10px 12px;min-height:56px;font-weight:700}
.step .ib{width:36px;height:36px;border-radius:12px}
.step .nm{flex:1}
.step .chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--a);display:grid;place-items:center;color:transparent;flex:none}
.step[aria-pressed="true"]{background:var(--a)}
.step[aria-pressed="true"] .chk{background:var(--ad);border-color:var(--ad);color:var(--on)}
.step[aria-pressed="true"] .nm{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ad)}
.tag{display:inline-flex;align-items:center;gap:6px;background:var(--lilac);color:var(--ink);font-weight:800;font-size:13px;border-radius:99px;padding:4px 12px}
.plan{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pd{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 0;border-radius:16px;background:var(--bg);font-size:12px;font-weight:800;color:var(--ink-soft)}
.pd.now{background:var(--lilac);color:var(--ink)}
.pd .ic{color:var(--sky-d)}
.pd.act .ic{color:var(--lilac-d)}

/* semana */
.dots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dot{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.dot i{width:30px;height:30px;border-radius:50%;border:2px solid var(--a);display:grid;place-items:center;color:var(--on)}
.dot.full i{background:var(--ad);border-color:var(--ad)}
.dot.part i{background:var(--a)}
.dot.fut{opacity:.35}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{border-radius:20px;padding:12px 10px;display:flex;flex-direction:column;gap:2px;background:var(--a)}
.tile b{font-family:var(--display);font-weight:600;font-size:21px}
.tile span{font-size:12px;font-weight:700;color:var(--ink-soft)}
.streak{display:flex;align-items:center;gap:10px;font-weight:700}
.streak .ib{width:36px;height:36px;border-radius:12px}
.streak .n{margin-left:auto;font-family:var(--display);font-weight:600}

/* ajustes */
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.field input[type=number],.field input[type=text]{width:110px;border:2px solid var(--a);border-radius:14px;background:var(--surface);padding:8px 12px;font-weight:700;text-align:right}
.row{display:flex;align-items:center;gap:10px}
.row .nm{flex:1;font-weight:700}
.mini{border:2px solid var(--a);background:var(--surface);color:var(--ink);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px;min-height:36px}
.mini.warn{background:var(--pink-d);border-color:var(--pink-d);color:var(--on)}
.addp{display:flex;flex-direction:column;gap:10px}
.addp input[type=text]{width:100%;border:2px solid var(--a);border-radius:14px;background:var(--surface);padding:10px 12px;font-weight:700}
.lbl{font-size:13px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em}
.btn{border:0;background:var(--pink-d);color:var(--on);font-family:var(--display);font-weight:600;font-size:17px;border-radius:99px;padding:12px 18px;min-height:48px}

/* navegación */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5}
.nav div{max-width:480px;margin:0 auto;display:flex;gap:6px}
.nav button{flex:1;border:0;background:transparent;border-radius:18px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:800;color:var(--ink-soft)}
.nav button[aria-current="page"]{background:var(--pink);color:var(--ink)}
.nav button[aria-current="page"] .ic{color:var(--pink-d)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="i-dumbbell" viewBox="0 0 24 24"><path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/></symbol>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var pad=function(n){return String(n).padStart(2,'0')};
var keyOf=function(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
var parse=function(k){var p=k.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
var addDays=function(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x};
var todayK=function(){return keyOf(new Date())};
var dowOf=function(k){return (parse(k).getDay()+6)%7};
var nf=function(n){return Number(n).toLocaleString('es-ES')};
var cap=function(s){return s.charAt(0).toUpperCase()+s.slice(1)};
var clone=function(o){return JSON.parse(JSON.stringify(o))};
var LET=['L','M','X','J','V','S','D'];
var DAYN=['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];
var ICONS=['drop','heart','sun','flask','sparkle'];

function icon(n,c){return '<svg class="ic '+(c||'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}

/* ---------- datos por defecto ---------- */
function defaultCfg(){
  var am=['limp','hidr','spf'];
  return {
    v:1,
    goals:{sleep:8,steps:10000,protein:100},
    sports:['Cardio','Fuerza'],
    products:[
      {id:'limp',name:'Limpiador',icon:'drop',active:false},
      {id:'hidr',name:'Hidratante',icon:'heart',active:false},
      {id:'spf',name:'Protector solar',icon:'sun',active:false},
      {id:'retinol',name:'Retinol',icon:'flask',active:true},
      {id:'azelaico',name:'Ácido azelaico',icon:'sparkle',active:true}
    ],
    plan:{
      '0':{am:am,pm:['limp','retinol','hidr']},
      '1':{am:am,pm:['limp','azelaico','hidr']},
      '2':{am:am,pm:['limp','hidr']},
      '3':{am:am,pm:['limp','retinol','hidr']},
      '4':{am:am,pm:['limp','azelaico','hidr']},
      '5':{am:am,pm:['limp','hidr']},
      '6':{am:am,pm:['limp','azelaico','hidr']}
    }
  };
}
function mergeCfg(d){
  var base=defaultCfg(), c=clone(d||{});
  base.goals=Object.assign(base.goals,c.goals||{});
  if(Array.isArray(c.products)&&c.products.length)base.products=c.products;
  if(Array.isArray(c.sports))base.sports=c.sports;
  if(c.plan)base.plan=Object.assign(base.plan,c.plan);
  return base;
}
function emptyDay(){return {sport:false,sportTypes:[],sleep:null,steps:null,protein:null,fv:{b:false,l:false,d:false},skin:{am:{},pm:{}}}}

/* ---------- estado ---------- */
var S={newSport:'',confirmSport:null,date:todayK(),tab:'hoy',days:{},cfg:defaultCfg(),mode:'loading',col:null,editDay:0,newIcon:'drop',newName:'',newActive:false,confirmDel:null,localHad:false,stale:false};
var LS='mdc-v1';
function loadLocal(){
  try{var r=localStorage.getItem(LS);if(r){var o=JSON.parse(r);S.days=o.days||{};S.cfg=mergeCfg(o.cfg);S.localHad=true}}catch(e){}
}
function persistLocal(){try{localStorage.setItem(LS,JSON.stringify({days:S.days,cfg:S.cfg}))}catch(e){}}

/* ---------- escritura en la nube, un documento cada vez ---------- */
var wq={};
function pushCloud(id,data){
  if(!S.col)return;
  var q=wq[id]||(wq[id]={timer:null,busy:false,dirty:false,data:null});
  q.data=data;clearTimeout(q.timer);q.timer=setTimeout(function(){flush(id)},350);
}
function flush(id){
  var q=wq[id];q.timer=null;
  if(q.busy){q.dirty=true;return}
  q.busy=true;
  S.col.doc(id).set(q.data).then(function(){S.err=false}).catch(function(){S.err=true;renderStatus()}).then(function(){
    q.busy=false;if(q.dirty){q.dirty=false;flush(id)}
  });
}
function pending(id){var q=wq[id];return !!(q&&(q.timer||q.busy||q.dirty))}

function dayTypes(d){return Array.isArray(d.sportTypes)?d.sportTypes:(d.sportType?[d.sportType]:[])}
function getDay(k){return S.days[k]||emptyDay()}
function upd(k,fn){var d=clone(getDay(k));if(!d.fv)d.fv={b:false,l:false,d:false};if(!d.skin)d.skin={am:{},pm:{}};fn(d);S.days[k]=d;persistLocal();pushCloud('d-'+k,d)}
function saveCfg(){persistLocal();pushCloud('config',S.cfg)}

/* ---------- cálculos ---------- */
function frac(day){
  var g=S.cfg.goals,fv=day.fv||{},n=(fv.b?1:0)+(fv.l?1:0)+(fv.d?1:0);
  return {
    sport:day.sport?1:0,
    sleep:day.sleep>0?Math.min(day.sleep/g.sleep,1):0,
    steps:day.steps>0?Math.min(day.steps/g.steps,1):0,
    fv:n/3,
    protein:day.protein>0?Math.min(day.protein/g.protein,1):0
  };
}
function pct(day){var f=frac(day);return (f.sport+f.sleep+f.steps+f.fv+f.protein)/5}
function prod(id){return S.cfg.products.filter(function(p){return p.id===id})[0]}
function skinPlan(k){
  var pl=S.cfg.plan[String(dowOf(k))]||{am:[],pm:[]};
  var m=function(ids){return ids.map(prod).filter(Boolean)};
  return {am:m(pl.am||[]),pm:m(pl.pm||[])};
}
function skinProg(k){
  var sp=skinPlan(k),d=getDay(k).skin||{am:{},pm:{}},done=0;
  sp.am.forEach(function(p){if(d.am&&d.am[p.id])done++});
  sp.pm.forEach(function(p){if(d.pm&&d.pm[p.id])done++});
  return {done:done,total:sp.am.length+sp.pm.length};
}
function skinFrac(k){var s=skinProg(k);return s.total?s.done/s.total:0}
function habitFrac(k,h){return h==='skin'?skinFrac(k):frac(getDay(k))[h]}
function streak(h){
  var d=parse(todayK());
  if(habitFrac(keyOf(d),h)<1)d=addDays(d,-1);
  var n=0;
  while(habitFrac(keyOf(d),h)>=1&&n<2000){n++;d=addDays(d,-1)}
  return n;
}

document.addEventListener('click',function(e){

  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v'),k=S.date;
  var num=function(x){return parseFloat(String(x).replace(',','.'))};
  switch(a){
    case 'tab':S.tab=v;S.confirmDel=null;S.confirmSport=null;window.scrollTo(0,0);break;
    case 'day':S.date=v;break;
    case 'prevw':S.date=keyOf(addDays(parse(k),-7));break;
    case 'nextw':var n=keyOf(addDays(parse(k),7));S.date=n>todayK()?todayK():n;break;
    case 'sport':upd(k,function(d){d.sport=!d.sport;if(!d.sport){d.sportTypes=[];d.sportType=null}});break;
    case 'sporttype':upd(k,function(d){var t=dayTypes(d).slice(),i=t.indexOf(v);if(i>-1)t.splice(i,1);else t.push(v);d.sportTypes=t;d.sportType=null;d.sport=t.length>0?true:d.sport});break;
    case 'delsport':
      if(S.confirmSport!==v){S.confirmSport=v;break}
      S.cfg.sports=S.cfg.sports.filter(function(x){return x!==v});S.confirmSport=null;saveCfg();break;
    case 'addsport':
      var sn=$('#ns-name').value.trim();if(!sn){$('#ns-name').focus();return}
      if(S.cfg.sports.indexOf(sn)<0)S.cfg.sports=S.cfg.sports.concat([sn]);
      S.newSport='';saveCfg();break;
    case 'sleep+':upd(k,function(d){d.sleep=Math.min(14,(d.sleep||0)+.5)});break;
    case 'sleep-':upd(k,function(d){d.sleep=Math.max(0,(d.sleep||0)-.5)});break;
    case 'sleepset':upd(k,function(d){d.sleep=d.sleep===Number(v)?null:Number(v)});break;
        case 'fv':upd(k,function(d){d.fv[v]=!d.fv[v]});break;
    case 'skin':var pp=v.split(':');upd(k,function(d){if(!d.skin[pp[0]])d.skin[pp[0]]={};d.skin[pp[0]][pp[1]]=!d.skin[pp[0]][pp[1]]});break;
    case 'editday':S.editDay=Number(v);break;
    case 'plantog':
      var q=v.split(':'),pl=S.cfg.plan[String(S.editDay)]||{am:[],pm:[]};
      pl=clone(pl);var ix=pl[q[0]].indexOf(q[1]);if(ix>-1)pl[q[0]].splice(ix,1);else pl[q[0]].push(q[1]);
      S.cfg.plan[String(S.editDay)]=pl;saveCfg();break;
    case 'delprod':
      if(S.confirmDel!==v){S.confirmDel=v;break}
      S.cfg.products=S.cfg.products.filter(function(p){return p.id!==v});
      Object.keys(S.cfg.plan).forEach(function(d){['am','pm'].forEach(function(pt){S.cfg.plan[d][pt]=(S.cfg.plan[d][pt]||[]).filter(function(id){return id!==v})})});
      S.confirmDel=null;saveCfg();break;
    case 'newicon':S.newName=$('#np-name').value;S.newIcon=v;break;
    case 'newactive':S.newName=$('#np-name').value;S.newActive=!S.newActive;break;
    case 'addprod':
      var name=$('#np-name').value.trim();if(!name){$('#np-name').focus();return}
      S.cfg.products=S.cfg.products.concat([{id:'p'+Date.now().toString(36),name:name,icon:S.newIcon,active:S.newActive}]);
      S.newName='';S.newActive=false;saveCfg();break;
  }
  render();
});
document.addEventListener('input',function(e){
  var t=e.target,k=S.date;
  if(t.matches('[data-in]')){
    var n=parseInt(String(t.value).replace(/\D/g,''),10);
    var field=t.getAttribute('data-in');
    upd(k,function(d){d[field]=isNaN(n)?null:n});
    live();
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.matches('[data-in]')){var d=getDay(S.date),f=t.getAttribute('data-in');t.value=d[f]?nf(d[f]):'';return}
  if(t.matches('[data-goal]')){
    var g=t.getAttribute('data-goal'),n=parseFloat(String(t.value).replace(',','.'));
    if(!(n>0)){t.value=S.cfg.goals[g];return}
    if(g==='sleep')n=Math.min(14,Math.round(n*2)/2);else n=Math.round(n);
    S.cfg.goals[g]=n;saveCfg();render();
  }
});
document.addEventListener('focusin',function(e){if(e.target.matches('[data-in]')){var v=e.target.value.replace(/\D/g,'');e.target.value=v}});

/* ---------- arranque ---------- */
loadLocal();
render();

function initCloud(){
  if(!window.claude||!window.claude.use){S.mode='local';render();return}
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];
    return (user&&user.id?user.id():Promise.resolve(null)).then(function(uid){
      if(!db||!uid){S.mode='local';render();return}
      S.col=db.collection('data/users/'+uid);
      S.mode='cloud';S.stale=false;
      var first=true,t=setTimeout(function(){S.stale=true;renderStatus()},10000);
      S.col.onSnapshot(function(snap){
        if(!snap.metadata.fromCache){clearTimeout(t);S.stale=false}
        snap.docs.forEach(function(doc){
          if(pending(doc.id))return;
          var data=doc.data();if(!data)return;
          if(doc.id==='config')S.cfg=mergeCfg(data);
          else if(doc.id.indexOf('d-')===0)S.days[doc.id.slice(2)]=clone(data);
        });
        if(first&&!snap.metadata.fromCache){
          first=false;
          if(snap.empty&&S.localHad){pushCloud('config',S.cfg);Object.keys(S.days).forEach(function(k){pushCloud('d-'+k,S.days[k])})}
        }
        persistLocal();
        var ae=document.activeElement;
        if(!(ae&&ae.tagName==='INPUT'))render();
      },function(){S.err=true;S.stale=true;renderStatus()});
      render();
    });
  }).catch(function(){S.mode='local';render()});
}
initCloud();
})();
</script>
